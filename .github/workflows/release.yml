name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # EffectivePlatform を明示しないと、WebView2 SDK がビルドホストの RID(win-x64) を見て
      # x64 の Microsoft.Web.WebView2.Core.dll を arm64 出力に混入させ、arm64 で BadImageFormat になる。
      - name: Build x64
        run: >
          dotnet publish XTimelineViewer.csproj
          -c Release -r win-x64 -p:Platform=x64 -p:EffectivePlatform=x64
          -p:WindowsPackageType=None -p:SelfContained=true
          -o publish/x64

      - name: Build arm64
        run: >
          dotnet publish XTimelineViewer.csproj
          -c Release -r win-arm64 -p:Platform=arm64 -p:PlatformTarget=arm64 -p:EffectivePlatform=arm64
          -p:WindowsPackageType=None -p:SelfContained=true
          -o publish/arm64

      - name: Add launcher (xtv.exe)
        shell: pwsh
        run: |
          # コマンドライン起動用の小さなネイティブランチャーを各 ZIP に同梱する（#264）。
          # ビルド済みの成果物をコミットしてあるためここでは再ビルドしない。
          Copy-Item tools/launcher/xtv.exe publish/x64/xtv.exe   -Force
          Copy-Item tools/launcher/xtv.exe publish/arm64/xtv.exe -Force

      - name: Create ZIP archives
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path publish/x64/*   -DestinationPath "XTimelineViewer-Kotsume-$tag-win-x64-Portable.zip"
          Compress-Archive -Path publish/arm64/* -DestinationPath "XTimelineViewer-Kotsume-$tag-win-arm64-Portable.zip"

      - name: Setup Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: scripts/installer.iss

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          files=(
            "XTimelineViewer-Kotsume-${tag}-win-x64-Portable.zip"
            "XTimelineViewer-Kotsume-${tag}-win-arm64-Portable.zip"
          )
          if [ -f "dist/XTimelineViewer-Kotsume-v2.1.0-Setup.exe" ]; then
            files+=("dist/XTimelineViewer-Kotsume-v2.1.0-Setup.exe")
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$tag" --generate-notes
          fi
